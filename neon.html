<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON HUNTER</title>

<style>
    body {
        background: #0a0a16;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
    }
    h1 {
        color: #ff007f;
        text-shadow: 0 0 10px #ff007f;
    }
    .input-box {
        background: #12122c;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        border: 1px solid #00f0ff;
    }
    input {
        width: 90%;
        padding: 10px;
        margin: 5px 0;
        border-radius: 6px;
        border: none;
        background: #1a1a3a;
        color: white;
    }
    button {
        width: 90%;
        padding: 12px;
        margin-top: 10px;
        background: #ff007f;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 16px;
        font-weight: bold;
        box-shadow: 0 0 10px rgba(255,0,127,0.4);
    }
    .qr-area {
        margin-top: 20px;
        padding: 15px;
        background: #12122c;
        border-radius: 10px;
        border: 1px solid #39ff14;
    }
</style>
</head>

<body>

<h1>NEON HUNTER</h1>
<p>ハンターする文字を登録してQRコードを作るよ！</p>

<div class="input-box">
    <input id="w1" placeholder="文字①">
    <input id="w2" placeholder="文字②">
    <input id="w3" placeholder="文字③">
    <input id="w4" placeholder="文字④">
    <input id="w5" placeholder="文字⑤">
    <button onclick="makeQR()">QRコードを作成！</button>
</div>

<div class="qr-area">
    <h3>📱 QRコード</h3>
    <div id="qrcode"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
function makeQR() {
    const words = [
        document.getElementById("w1").value.trim(),
        document.getElementById("w2").value.trim(),
        document.getElementById("w3").value.trim(),
        document.getElementById("w4").value.trim(),
        document.getElementById("w5").value.trim()
    ];

    const url = "https://megumi.github.io/neonhunter.html?" + 
        words.map((w,i)=>`w${i+1}=${encodeURIComponent(w)}`).join("&");

    document.getElementById("qrcode").innerHTML = "";

    new QRCode(document.getElementById("qrcode"), {
        text: url,
        width: 200,
        height: 200
    });
}
</script>

</body>
</html>
